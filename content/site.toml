I came to finance from **molecular biology**, and that turns out to be a useful
place to start. Both disciplines are about the same problem: estimating
something you cannot observe directly, then being honest about the error bars.
I write the code myself, backtest it against reality, and document what the
model cannot see. My work sits where **healthcare and biotech** meet
**capital markets** — where reading a clinical trial readout and reading a cash
flow statement are the same job.
"""


