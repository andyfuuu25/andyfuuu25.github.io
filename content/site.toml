# ---------------------------------------------------------------------------
[[work.projects]]
title = "Equity Research Desk"
kind  = "Full-stack · Quant"
url   = "https://github.com/andyfuuu25/equity-research-desk"
summary = """
Type a ticker and get an analyst-style research profile in 8 to 15 seconds: a
plain-English business summary, forward catalysts sorted into confirmed,
developing and risk, and a five-factor quantitative score. All of it runs on
free data sources and free-tier APIs.
"""
points = [
  "I did not invent the five factors. They come from published research: EBIT/EV (Greenblatt), 12-1 momentum (Jegadeesh and Titman), gross profitability (Novy-Marx), Sloan accruals, and idiosyncratic volatility (Ang et al.).",
  "Each factor is scored as a sector percentile rank against the S&P 500, drawn from a locally built snapshot of all 503 constituents. That is how institutional factor shops score stocks. Weights shift by sector, because gross profit means nothing for a bank.",
  "There is an earnings-quality gate. When reported income runs far ahead of the cash actually generated, the badge flips to **FLAGGED** and the composite score caps at 40.",
  "On the engineering side it makes one merged LLM call per report, falls back to a second model when the quota runs out, and fetches everything in parallel. Any single source can fail without blocking the report.",
]
tags = ["Python", "FastAPI", "Next.js", "yfinance", "Gemini API", "Factor models"]
links = [
  { label = "View on GitHub", href = "https://github.com/andyfuuu25/equity-research-desk" },
]

# ---------------------------------------------------------------------------
[[work.projects]]
title = "MLB Hybrid Season Simulator"
kind  = "Simulation · ML"
url   = "https://github.com/andyfuuu25/2026-MLB-Monte-Carlo-Simulation-Project"
summary = """
A season-projection engine that combines team-level Elo ratings with
bottom-up player projections through a logistic classifier, then runs the
result through a 10,000-trial vectorized Monte Carlo of the schedule and
postseason bracket. It is the same forecasting problem markets pose:
separating signal from variance over a long horizon.
"""
points = [
  "A walk-forward backtest rebuilds the pipeline exactly as it would have existed on Opening Day 2024 and 2025, with no future data, then scores it blind. The 80% win bands cover **81.7%** of actual team-seasons, and the playoff-odds Brier score (0.206) beats the climatology baseline (0.240).",
  "I found a data leak in my own model. Training on same-season roster stats was feeding September performance into April predictions. Switching to prior-season features dropped in-sample accuracy from an inflated 0.572 to an honest 0.550, and 0.550 is the number that shipped.",
  "The two sources of uncertainty are modelled separately: a per-trial latent talent draw, with sigma calibrated by a backtest sweep, and per-game Bernoulli noise. Scenario comparisons share random seeds, so the deltas are causal, not noise.",
  "Two ablations are trained and reported next to the main model. Hybrid beats Elo-only, which beats the baseline, on out-of-sample log-loss. That is the evidence the roster feature earns its place.",
]
tags = ["Python", "NumPy", "scikit-learn", "Flask", "Monte Carlo", "Backtesting"]
links = [
  { label = "View on GitHub", href = "https://github.com/andyfuuu25/2026-MLB-Monte-Carlo-Simulation-Project" },
]

# ---------------------------------------------------------------------------
[[work.projects]]
title = "Summit Therapeutics: post-WCLC review"
kind  = "Equity research"
url   = "research/summit-therapeutics.html"
summary = """
A research note on Summit Therapeutics (Nasdaq: SMMT), a single-asset biotech
whose whole value rests on one bispecific antibody. I wrote it after WCLC 2026
produced the first Phase III overall-survival win against Keytruda. The note
argues that the result is real but does not answer the question the stock is
actually priced on.
"""
points = [
  "Most of the work is separating what the data proved from what it did not. HARMONi-2 is a China-only, interim, secondary-endpoint result in monotherapy. The two subgroups that matter most for Summit's own pivotal trial, PD-L1 1-49% and non-squamous, both still cross 1.",
  "The call is Neutral, with the thresholds written down in advance: positive on a squamous final PFS HR at or below 0.70 that holds in Western patients, negative on a miss or a benefit confined to Asian sites. Stating what would change your mind *before* the readout is the part anyone can check afterwards.",
  "Every number ties back to one of **31 numbered sources**: company filings, the 10-Q going-concern language, trial registries, and the conference presentations themselves.",
]
tags = ["Biotech valuation", "Clinical due diligence", "Catalyst mapping", "Equity research"]
figures = [
  { src = "assets/img/smmt-exhibit1.jpg", alt = "Exhibit 1: HARMONi overall survival hazard ratios across three data cuts, showing the ITT interval excluding 1 while the Western subgroup interval does not", caption = "Exhibit 1. HARMONi OS across three cuts" },
]
links = [
  { label = "Read the full note", href = "research/summit-therapeutics.html" },
  { label = "Download the PDF", href = "assets/files/Andy_Fu_SMMT_Research_Note.pdf" },
]

# ---------------------------------------------------------------------------
[[work.projects]]
title = "Aging genes in arthropods: a structured literature review"
kind  = "Research · Capstone"
url   = "research/aging-genes-arthropods.html"
summary = """
My HKU capstone: a structured review of 41 papers asking whether
stress-response genes, mainly heat shock proteins, actually drive aging in
arthropods. The headline result is a negative one about the field itself. The
literature is large and active, but it almost never runs the test its own
framing implies.
"""
points = [
  "The review is a six-sheet queryable database rather than a reading list: one row per paper across 16 coded fields, a 0/1 flag matrix so multi-valued tags count correctly, live-formula summaries, and a stress-type by hallmark evidence map that makes the empty cells visible.",
  "The finding is the gap itself. HSP70 carries 51% of the literature and loss of proteostasis 71%, but only 29% of papers measure lifespan or age-related change at all, and just **two** manipulate a gene and then show a longevity effect. Telomere attrition and cellular senescence have none.",
  "Every cleaning decision is logged in a **Data_QA sheet**: species synonyms that had been double-counted, malformed gene entries, and three papers whose hallmark labels were non-standard and left flagged as *Unmapped* rather than quietly forced into a category.",
  "It also records what the data cannot support. The source sheet carries no publication years, so trends over time are left out rather than estimated. Everything is coded against the López-Otín hallmarks of aging framework.",
]
tags = ["Systematic review", "Research design", "Evidence grading", "Data cleaning", "Excel", "Molecular biology"]
figures = [
  { src = "assets/img/capstone-hallmarks.jpg", alt = "Two charts: papers per aging hallmark, led by loss of proteostasis at 29 with telomere attrition and cellular senescence at zero; and papers by strength of evidence, 24 correlational against 12 causal and 5 biomarker", caption = "Where the evidence clusters, and how strong it is" },
]
links = [
  { label = "Read the review", href = "research/aging-genes-arthropods.html" },
  { label = "Executive summary (PDF)", href = "assets/files/Andy_Fu_Capstone_Executive_Summary.pdf" },
  { label = "Coded database (XLSX)", href = "assets/files/Andy_Fu_Capstone_LitReview_Database.xlsx" },
]

