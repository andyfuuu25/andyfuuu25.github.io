Incoming MSc Finance at HKUST. I build quantitative research tools:
factor models, Monte Carlo simulators and valuation engines.
"""

bio = """
I came to finance from molecular biology, which turns out to be a useful place
to start. Both fields ask the same question: how do you estimate something you
cannot measure directly, and how honest are you about the error bars? I write
the code myself, test it against what actually happened, and document what
the model cannot see. Most of my work sits between healthcare and capital
markets. A clinical trial readout and a cash flow statement are not that
different to read.
"""


